    <style>html,body{color:#d8e0ee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:#04060b;height:100%;margin:0;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}#app,canvas{width:100%;height:100%;display:block}.hud{pointer-events:none;white-space:pre;background:#04060bb8;border:1px solid #d8e0ee26;margin:0;padding:6px 8px;position:fixed;top:8px;left:8px}.bench-panel{background:#04060be0;border:1px solid #d8e0ee40;max-width:calc(100vw - 16px);padding:8px 10px;position:fixed;bottom:8px;right:8px;overflow-x:auto}.bench-panel h2{margin:0 0 6px;font-size:13px}.bench-panel table{border-collapse:collapse}.bench-panel td,.bench-panel th{text-align:right;border-bottom:1px solid #d8e0ee1f;padding:2px 8px}@media (max-height:520px),(max-width:600px){.hud,.bench-panel{font-size:9px;line-height:1.25}}#boot{z-index:50;background:#04060b;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif;transition:opacity .4s;display:flex;position:fixed;inset:0}#boot.gone{opacity:0;pointer-events:none}#boot h1{letter-spacing:.3em;color:#e9dcc0;margin:0 0 6px;font-size:30px;font-weight:600}#boot .bar{background:#d8e0ee1f;width:min(280px,70vw);height:3px;position:relative;overflow:hidden}#boot .bar i{background:#ffd98a;width:0;transition:width .2s;position:absolute;inset:0 auto 0 0}#boot.wait .bar i{width:30%;animation:1.2s ease-in-out infinite alternate boot-wait}@keyframes boot-wait{0%{left:0}to{left:70%}}#boot .say{color:#d8e0ee;font-size:13px}#boot .hint{color:#d8e0ee8c;font-size:12px}#boot button{font:inherit;color:#04060b;cursor:pointer;background:#ffd98a;border:0;padding:8px 22px;font-size:14px;display:none}#boot.failed button{display:block}#boot.failed .bar,#boot.failed .hint{display:none}@media (prefers-reduced-motion:reduce){#boot.wait .bar i{opacity:.4;width:100%;animation:none}}.fatal{color:#ff8a80;white-space:pre-wrap;margin:0;position:fixed;inset:8px}</style>

    <link rel="modulepreload" crossorigin href="./assets/contract-DxpiZV18.js">

  <body>
    <div id="app"></div>
    <div id="boot" class="wait" role="status" aria-live="polite">
      <h1>夜未央</h1>
      <div class="bar"><i></i></div>
      <div class="say">正在加载游戏…</div>
      <div class="hint">第一次打开会慢一些，之后会快很多</div>
      <button type="button" onclick="location.reload()">重新加载</button>
    </div>
    <script>
      // the words in the browser's language, before the game's own come
      if (!/^zh\b/i.test(navigator.language || '')) {
        var b = document.getElementById('boot');
        b.querySelector('.say').textContent = 'Loading the game…';
        b.querySelector('.hint').textContent = 'The first visit is slower; after that it is quick';
        b.querySelector('button').textContent = 'Try again';
      }
    </script>
  </body>
